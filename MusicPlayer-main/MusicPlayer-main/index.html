<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Music Player</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <nav class="panel nav-panel" aria-label="Primary">
        <button class="nav-item active" data-nav="home">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33zm-2-1.732a3 3 0 0 1 3 0l7.5 4.33a2 2 0 0 1 1 1.732V21a1 1 0 0 1-1 1h-6.5a1 1 0 0 1-1-1v-6h-3v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7.577a2 2 0 0 1 1-1.732l7.5-4.33z"/></svg>
          Home
        </button>
        <button class="nav-item" data-nav="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          Search
        </button>
      </nav>

      <section class="panel library-panel" aria-label="Your Library">
        <div class="library-header">
          <button class="library-title" data-nav="library">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
            Your Library
          </button>
          <button class="icon-btn" id="newPlaylistBtn" title="Create playlist" aria-label="Create playlist">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <div class="library-filters" id="libraryFilters">
          <button class="pill active" data-lib-filter="playlists">Playlists</button>
          <button class="pill" data-lib-filter="albums">Albums</button>
          <button class="pill" data-lib-filter="artists">Artists</button>
        </div>

        <div class="library-list" id="libraryList"></div>

        <div class="library-footer">
          <button class="text-link" id="exportPlaylistsBtn" title="Download your playlists as playlist.json">Export JSON</button>
          <span id="trackTotalBadge" style="font-size:11px;color:var(--text-muted);padding-right:6px;">0 songs</span>
        </div>
      </section>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="history-btns">
          <button class="circle-nav" id="backBtn" disabled aria-label="Go back">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
          </button>
          <button class="circle-nav" id="fwdBtn" disabled aria-label="Go forward">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
          </button>
        </div>

        <label class="search-box" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="globalSearch" type="search" autocomplete="off" placeholder="What do you want to play?">
        </label>

        <div class="topbar-actions">
          <button class="btn-pill secondary" id="topCreatePlaylistBtn">+ Playlist</button>
        </div>
      </header>

      <div class="scroll-area" id="mainScroll"></div>
    </main>

    <footer class="player" aria-label="Audio Player">
      <div class="now-playing">
        <div class="np-cover" id="npCover">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="np-text">
          <div class="np-title" id="npTitle">Select a song</div>
          <button class="np-artist" id="npArtistBtn" disabled>—</button>
        </div>
        <button class="t-btn" id="npLikeBtn" title="Save to Liked Songs" aria-label="Save to Liked Songs" style="opacity:1;margin-left:4px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>

      <div class="player-center">
        <div class="transport">
          <button class="ctrl-btn" id="shuffleBtn" title="Shuffle" aria-label="Shuffle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
          <button class="ctrl-btn" id="prevBtn" title="Previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3.5 7 9.5 6V6z"/></svg>
          </button>
          <button class="play-main" id="playPauseBtn" title="Play" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="7 4 20 12 7 20 7 4"/></svg>
          </button>
          <button class="ctrl-btn mobile-keep" id="nextBtn" title="Next" aria-label="Next">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 6v12l9.5-6z"/></svg>
          </button>
          <button class="ctrl-btn" id="repeatBtn" title="Repeat" aria-label="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>
        </div>
        <div class="seek-wrap">
          <span id="elapsedTime">0:00</span>
          <input id="seekBar" class="sp-range" type="range" min="0" max="1000" value="0" aria-label="Seek">
          <span id="totalTime">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="btn-pill secondary hidden" id="videoModeBtn" style="padding:5px 10px;font-size:12px;">Video</button>
        <div class="vol-wrap">
          <button class="ctrl-btn" id="muteBtn" title="Mute" aria-label="Mute">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </button>
          <input id="volumeBar" class="sp-range" type="range" min="0" max="100" value="80" aria-label="Volume">
        </div>
      </div>
    </footer>

    <nav class="mobile-nav" aria-label="Mobile Navigation">
      <button class="active" data-nav="home">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 3.247a1 1 0 0 0-1 0L4 7.577V20h4.5v-6a1 1 0 0 1 1-1h5a1 1 0 0 1 1 1v6H20V7.577l-7.5-4.33z"/></svg>
        Home
      </button>
      <button data-nav="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        Search
      </button>
      <button data-nav="library">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
        Library
      </button>
    </nav>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <video id="video" preload="metadata" hidden></video>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="playlistModal">
    <form id="playlistForm" class="modal-body">
      <div class="modal-head">
        <h2 id="playlistModalTitle">Create playlist</h2>
        <button type="button" class="icon-btn" data-close-modal="playlistModal" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <input type="hidden" name="id" id="plEditId">
      <label class="field">Name<input name="name" id="plNameInput" maxlength="70" required placeholder="My Playlist"></label>
      <label class="field">Description<textarea name="description" id="plDescInput" maxlength="200" placeholder="Add an optional description"></textarea></label>
      <label class="field">Cover Image URL (optional)<input name="cover" id="plCoverInput" placeholder="./Music/Covers/cover.jpg or https://..."></label>
      <label class="field">Or upload a cover image<input type="file" id="plCoverFile" accept="image/*" style="padding:6px;"></label>
      <div class="modal-actions">
        <button type="button" class="btn-danger hidden" id="deletePlaylistBtn">Delete</button>
        <button type="button" class="btn-pill secondary" data-close-modal="playlistModal">Cancel</button>
        <button type="submit" class="btn-pill">Save</button>
      </div>
    </form>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
